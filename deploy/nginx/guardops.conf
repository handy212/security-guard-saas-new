# Host nginx site for GuardOps (Ubuntu VPS).
#
# Docker: proxies HTTP to docker-compose nginx on 127.0.0.1:8080
# Native: uncomment the php-fpm block at the bottom instead.
#
# Install:
#   sudo cp deploy/nginx/guardops.conf /etc/nginx/sites-available/guardops
#   sudo ln -s /etc/nginx/sites-available/guardops /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d app.guardops.com -d '*.guardops.com'

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name app.guardops.com *.guardops.com;

    # Certbot will add SSL listen directives here.

    client_max_body_size 20M;

    # --- Docker path (default) ---
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Laravel Reverb WebSockets (dispatch control room).
    location /app {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # --- Native path: replace the two blocks above with this ---
    # root /var/www/guardops/public;
