# Native VPS only — queue worker and Reverb (not needed when using Docker Compose).
#
# Install:
#   sudo cp deploy/supervisor/guardops.conf /etc/supervisor/conf.d/guardops.conf
#   sudo supervisorctl reread && sudo supervisorctl update

[program:guardops-queue]
process_name=%(program_name)s
command=php /var/www/guardops/artisan queue:work redis --sleep=1 --tries=3 --max-time=3600
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/guardops/storage/logs/queue.log
stopwaitsecs=3600

[program:guardops-reverb]
process_name=%(program_name)s
command=php /var/www/guardops/artisan reverb:start --host=127.0.0.1 --port=8081
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/guardops/storage/logs/reverb.log
