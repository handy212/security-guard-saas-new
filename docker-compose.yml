services:
  app:
    build: .
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/var/www/html/docker/entrypoint.sh"]
    command: ["php-fpm"]
    volumes:
      - .:/var/www/html
    depends_on:
      - mysql
      - redis

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: guard_saas
      MYSQL_USER: guardops
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"

  queue:
    build: .
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/var/www/html/docker/entrypoint.sh"]
    command: php artisan queue:work redis --queue=default --sleep=1 --tries=3
    volumes:
      - .:/var/www/html
    depends_on:
      - redis
      - mysql

  queue-heavy:
    build:
      context: .
      dockerfile: Dockerfile.heavy
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/var/www/html/docker/entrypoint.sh"]
    command: php artisan queue:work redis --queue=heavy --sleep=1 --tries=3 --timeout=180
    volumes:
      - .:/var/www/html
    environment:
      CHROME_PATH: /usr/bin/chromium
      ID_CARD_PDF_DRIVER: browsershot
    depends_on:
      - redis
      - mysql

  scheduler:
    build: .
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/var/www/html/docker/entrypoint.sh"]
    command: php artisan schedule:work
    volumes:
      - .:/var/www/html
    depends_on:
      - mysql
      - redis

  reverb:
    build: .
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/var/www/html/docker/entrypoint.sh"]
    command: php artisan reverb:start --host=0.0.0.0 --port=8081
    ports:
      - "8081:8081"
    volumes:
      - .:/var/www/html
    depends_on:
      - redis

volumes:
  mysql_data:
