# Production overrides — use with:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# !reset replaces merged port lists (otherwise dev + prod ports stack).

services:
  nginx:
    ports: !override
      - "127.0.0.1:8080:80"

  reverb:
    ports: !override
      - "127.0.0.1:8081:8081"

  mysql:
    ports: !reset []

  redis:
    ports: !reset []
