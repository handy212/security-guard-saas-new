components:
  parameters:
    JwmDeviceId:
      name: device
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
    JwmPage:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    JwmPerPage:
      name: per_page
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 15 }
  responses:
    JwmValidation:
      description: Invalid input, missing/ambiguous guard interval, unknown/conflicting mapping, duplicate immutable mapping, disabled mapping target device, or ineligible patrol. Nothing is written.
      content:
        application/json:
          schema:
            type: object
            properties:
              message: { type: string }
              errors:
                type: object
                additionalProperties: { type: array, items: { type: string } }
  securitySchemes:
    jwmBridge:
      type: http
      scheme: bearer
      description: Device-bound Sanctum token with explicit jwm:ingest ability
    sanctum:
      type: http
      scheme: bearer
  schemas:
    JwmTimestamp:
      type: string
      format: date-time
      description: Whole seconds, explicit Z or offset (maximum 14:00), normalized to UTC. Events must not be in the future or before 1970-01-01T00:00:01Z.
      example: '2026-11-12T09:30:00Z'
    JwmEventId:
      type: string
      maxLength: 100
      pattern: '^[a-z0-9][a-z0-9._:-]*$'
      description: Stable per-device identity across retries. Different IDs are not deduplicated; TCP/USB cross-transport identity needs hardware verification.
    JwmExternalId:
      type: string
      minLength: 1
      maxLength: 100
      pattern: '^[!-~]+$'
      description: Opaque printable ASCII without whitespace. Preserves exact case and leading zeroes. Reader-scoped and not a biometric template or proof of a fingerprint match.
    JwmGpsEvent:
      type: object
      additionalProperties: false
      required: [event_id, type, occurred_at, latitude, longitude]
      properties:
        event_id: { $ref: '#/components/schemas/JwmEventId' }
        type: { type: string, enum: [gps] }
        occurred_at: { $ref: '#/components/schemas/JwmTimestamp' }
        latitude: { type: number, minimum: -90, maximum: 90 }
        longitude: { type: number, minimum: -180, maximum: 180 }
        guard_external_id: { $ref: '#/components/schemas/JwmExternalId' }
    JwmCheckpointEvent:
      type: object
      additionalProperties: false
      required: [event_id, type, occurred_at, patrol_session_id]
      description: Strict readers require both external IDs. Other readers accept either checkpoint identifier; a supplied external guard ID must still agree with the interval.
      oneOf:
        - required: [checkpoint_code]
          not: { required: [checkpoint_external_id] }
        - required: [checkpoint_external_id]
          not: { required: [checkpoint_code] }
      properties:
        event_id: { $ref: '#/components/schemas/JwmEventId' }
        type: { type: string, enum: [checkpoint] }
        occurred_at: { $ref: '#/components/schemas/JwmTimestamp' }
        patrol_session_id: { type: integer }
        checkpoint_code: { type: string, maxLength: 100 }
        guard_external_id: { $ref: '#/components/schemas/JwmExternalId' }
        checkpoint_external_id: { $ref: '#/components/schemas/JwmExternalId' }
        latitude: { type: number, nullable: true, minimum: -90, maximum: 90 }
        longitude: { type: number, nullable: true, minimum: -180, maximum: 180 }
    JwmDevice:
      type: object
      properties:
        id: { type: integer }
        tenant_id: { type: integer }
        name: { type: string }
        reader_number: { type: string }
        model: { type: string, enum: [JWM5000ZG] }
        is_active: { type: boolean }
        require_device_identity: { type: boolean, default: false }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    JwmGuardMapping:
      type: object
      properties:
        id: { type: integer }
        tenant_id: { type: integer }
        jwm_device_id: { type: integer }
        external_id: { $ref: '#/components/schemas/JwmExternalId' }
        guard_id: { type: integer, nullable: true, description: Null reserves the ID after target deletion }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    JwmCheckpointMapping:
      type: object
      properties:
        id: { type: integer }
        tenant_id: { type: integer }
        jwm_device_id: { type: integer }
        external_id: { $ref: '#/components/schemas/JwmExternalId' }
        patrol_checkpoint_id: { type: integer, nullable: true, description: Null reserves the ID after target deletion }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    JwmAssignment:
      type: object
      properties:
        id: { type: integer }
        tenant_id: { type: integer }
        jwm_device_id: { type: integer }
        guard_id: { type: integer }
        starts_at: { type: string, format: date-time }
        ends_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    JwmEventResult:
      type: object
      required: [data, replayed]
      properties:
        replayed: { type: boolean }
        data:
          type: object
          properties:
            id: { type: integer }
            tenant_id: { type: integer }
            jwm_device_id: { type: integer }
            event_id: { $ref: '#/components/schemas/JwmEventId' }
