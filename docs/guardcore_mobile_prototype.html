<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080d16"><title>GuardCore Pro | Field App Prototype</title><style>
:root{--bg:#090e17;--panel:#121c2b;--panel2:#172336;--line:#2b3b50;--text:#f3f6fc;--muted:#9badc2;--red:#ee333b;--green:#2ccc83;--amber:#f0b94c;--blue:#62a7ff;--radius:17px}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% -20%,#20354f,#080d16 60%);font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--text)}button,input,select,textarea{font:inherit}button{cursor:pointer}button:disabled{opacity:.4;cursor:not-allowed}.shell{max-width:440px;min-height:100dvh;margin:auto;background:var(--bg);box-shadow:0 12px 70px #0009;position:relative}.app-header{position:sticky;top:0;z-index:4;background:#0b1420f7;border-bottom:1px solid var(--line);padding:19px 19px 15px;backdrop-filter:blur(15px)}.top{display:flex;align-items:center;justify-content:space-between;gap:8px}.brand{display:flex;align-items:center;gap:10px;min-width:0}.mark{width:43px;height:43px;border:2px solid #f13d44;border-radius:13px;display:grid;place-items:center;background:#27161d;color:#fff;font-size:26px;font-weight:900}.brand strong{font-size:19px;white-space:nowrap}.brand strong span{color:#ff4048}.sub{font-size:12px;color:var(--muted)}.green{color:var(--green)}.buttons{display:flex;gap:8px;align-items:center}.iconbtn{height:37px;min-width:37px;background:#152131;color:#fff;border:1px solid #33465b;border-radius:12px;font-size:18px;position:relative}.tinyCount{position:absolute;right:-5px;top:-6px;background:var(--red);border-radius:99px;font-size:11px;padding:2px 5px}.sos{border:1px solid #ff424a;border-radius:12px;color:#fff;background:#9d0715;font-weight:800;padding:10px 15px;letter-spacing:.4px}.statusline{display:flex;gap:9px;margin-top:13px;flex-wrap:wrap}.status{background:#152636;border:1px solid #2d4355;border-radius:99px;padding:5px 9px;font-size:11px;color:#bdcfdf}.status b{color:#42dc94}.content{padding:22px 17px 112px;min-height:calc(100dvh - 170px)}h1{font-size:28px;letter-spacing:-.8px;margin:0 0 4px}h2{font-size:18px;margin:0 0 12px}p{margin:0;color:var(--muted);line-height:1.5}.eyebrow{font-size:11px;letter-spacing:.08em;color:var(--muted);font-weight:750;text-transform:uppercase;margin-bottom:8px}.section{margin-top:20px}.card{background:linear-gradient(145deg,#172333,#111a27);border:1px solid #2e4053;border-radius:var(--radius);padding:16px;margin-top:12px}.card.urgent{background:linear-gradient(145deg,#391721,#1d1720);border-color:#b8313c}.card.ok{background:linear-gradient(145deg,#103627,#122426);border-color:#287a55}.row{display:flex;align-items:center;gap:10px}.between{justify-content:space-between}.grow{flex:1;min-width:0}.muted{color:var(--muted)}.small{font-size:12px}.title{font-weight:760;font-size:17px}.big{font-size:22px;font-weight:800}.chip{padding:5px 9px;border-radius:99px;font-size:11px;font-weight:800;white-space:nowrap;background:#293d57;color:#cbe2ff}.chip.red{background:#6e1c27;color:#ffcbd0}.chip.green{background:#154e37;color:#9ff4cb}.chip.amber{background:#59421f;color:#ffe3a4}.sep{height:1px;background:#344254;margin:14px 0}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:15px}.stat{background:#142031;border:1px solid #2b3a4a;border-radius:13px;padding:12px 8px;text-align:center}.stat strong{display:block;font-size:20px}.stat span{font-size:10px;color:var(--muted)}.btn{border:1px solid #456078;background:#1a2a3d;color:#f8fbff;border-radius:11px;min-height:44px;padding:10px 13px;font-weight:750}.btn.primary{background:#e52736;border-color:#ff434c;color:white}.btn.success{background:#148253;border-color:#29b879}.btn.white{background:#f1f5fa;color:#0c1624;border-color:#f1f5fa}.btn.block{width:100%}.btnrow{display:flex;gap:9px;margin-top:12px}.btnrow>*{flex:1}.tabrow{display:flex;gap:7px;overflow-x:auto;margin:17px 0 10px;scrollbar-width:none}.tabrow button{border:1px solid #35485b;background:#142032;color:#bec8d7;border-radius:11px;padding:10px 14px;white-space:nowrap}.tabrow button.selected{background:#e42b38;border-color:#fa4653;color:#fff;font-weight:800}.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(440px,100%);background:#0b1320f7;border-top:1px solid #2b3b50;display:flex;z-index:5;padding:8px 5px max(10px,env(safe-area-inset-bottom));backdrop-filter:blur(18px)}.nav{flex:1;background:none;border:0;color:#899ab1;display:flex;align-items:center;flex-direction:column;gap:3px;font-size:11px;padding:4px 0}.nav .glyph{font-size:22px}.nav.active{color:#ff4853;font-weight:800}.nav.active:after{content:'';display:block;width:36px;height:3px;border-radius:3px;background:#ff3b46}.item{padding:13px 12px;border-radius:12px;border:1px solid #334559;background:#172334;display:flex;gap:11px;align-items:center;margin-top:8px;cursor:pointer}.item .symbol{font-size:22px;width:32px;text-align:center}.item .grow strong{font-size:14px}.item .grow p{font-size:12px}.bar{height:8px;border-radius:9px;background:#344354;overflow:hidden;margin-top:11px}.fill{height:100%;background:var(--green);border-radius:9px}.steps{display:flex;justify-content:space-between;margin:18px 0}.step{flex:1;text-align:center;font-size:10px;color:#8192a9;position:relative}.step:before{content:'';display:block;width:19px;height:19px;border-radius:50%;background:#334255;border:2px solid #53647a;margin:0 auto 7px}.step.done:before{background:#158753;border-color:#35d18a}.step.current:before{background:#f03640;border-color:#ff7a81}.step.done,.step.current{color:#f3f6fc}.field{width:100%;border:1px solid #41536a;background:#0b1522;color:#f7f9fd;border-radius:11px;padding:13px;outline:none;margin-top:7px}.field:focus{border-color:#86a8d3}.label{font-size:12px;color:#cbd7e5;font-weight:650;margin-top:12px}.toolbar{display:grid;grid-template-columns:1fr 1fr;gap:9px}.map{height:155px;border-radius:13px;border:1px solid #3f536b;background:repeating-linear-gradient(32deg,transparent 0 35px,#334b60 36px 38px,transparent 39px 75px),repeating-linear-gradient(128deg,#14283b 0 49px,#294058 50px 52px,#14283b 53px 100px);display:flex;align-items:center;justify-content:center;position:relative;margin:12px 0;overflow:hidden}.map:after{content:'●  SITE';position:absolute;color:white;font-size:13px;font-weight:800;background:#bd2533;border:1px solid #ff8189;border-radius:25px;padding:9px 13px;box-shadow:0 0 0 14px #c51d2433}.map .corner{position:absolute;bottom:8px;right:9px;font-size:10px;z-index:1;background:#0c1629c9;padding:5px;border-radius:5px}.tiles{display:grid;grid-template-columns:1fr 1fr;gap:9px}.tile{background:#172334;border:1px solid #33475b;padding:13px;border-radius:12px;text-align:left;color:white;min-height:85px}.tile .sym{font-size:22px;display:block;margin-bottom:10px}.tile strong{font-size:13px}.tile p{font-size:11px;margin-top:3px}.overlay{position:fixed;inset:0;background:#02050bd9;display:flex;align-items:center;justify-content:center;z-index:10;padding:20px}.modal{width:min(410px,100%);background:#142031;border:1px solid #54627a;border-radius:21px;padding:22px;box-shadow:0 20px 70px #000c;max-height:85dvh;overflow:auto}.modal h2{font-size:23px}.soshero{text-align:center;color:#ff5960;font-size:55px;padding:14px 0}.callout{padding:11px 13px;background:#38201f;border:1px solid #975046;border-radius:12px;color:#ffd5c8;font-size:13px}.listline{padding:12px 0;border-bottom:1px solid #2b3c51}.listline:last-child{border:0}.count{color:#fff;background:#c72832;border-radius:99px;padding:1px 7px;font-size:12px}.empty{text-align:center;padding:36px 10px;color:#a9b7c9}.center{text-align:center}.snack{position:fixed;bottom:85px;left:50%;transform:translateX(-50%);width:min(400px,calc(100% - 28px));padding:12px 16px;background:#21364a;border:1px solid #58819d;border-radius:12px;z-index:20;font-size:13px;box-shadow:0 10px 22px #0007}.scanbox{height:205px;border:3px solid #ef3842;border-radius:19px;display:grid;place-items:center;background:linear-gradient(140deg,#162638,#0e1623);margin:15px 0}.scanbox span{font-size:60px;color:white}.footerhint{font-size:11px;color:#8193a9;margin-top:15px;text-align:center}.audit{background:#0f1b2a;border-left:2px solid #d33542;padding:11px 14px;margin:8px 0;border-radius:0 9px 9px 0}.audit small{color:#8ca1b8}.switch{display:flex;align-items:center;justify-content:space-between;padding:13px 0;border-bottom:1px solid #2c3c50}.switch input{accent-color:#eb3643;width:20px;height:20px}@media(min-width:700px){body{padding:24px}.shell{min-height:850px;border:1px solid #39495c;border-radius:30px;overflow:hidden}.bottom{bottom:24px;border-radius:0 0 30px 30px}}
</style></head><body><div class="shell"><header class="app-header"><div class="top"><div class="brand"><div class="mark">◆</div><div><strong>GuardCore <span>Pro</span></strong><div class="sub">Field operations · Demo prototype</div></div></div><div class="buttons"><button class="iconbtn" aria-label="Notifications" onclick="openPage('notifications')">♧<span class="tinyCount" id="nbadge">2</span></button><button class="sos" onclick="openSOS()">◉ SOS</button></div></div><div class="statusline"><span class="status"><b id="dutyLabel">● On duty</b></span><span class="status"><b>⌖ GPS active</b></span><span class="status">● Sample data</span></div></header><main class="content" id="main"></main><nav class="bottom" id="bottom"></nav></div><div id="modals"></div><div id="snack"></div><script>
const S={page:'home',sub:'',dispatch:'Assigned',patrol:'Not started',scans:0,duty:true,notes:'',outcome:'',evidence:false,seen:false,alerts:[{id:1,title:'New Patriot alarm assignment',text:'PAT-2018 · Accra House',severity:'Critical',read:false},{id:2,title:'Night round reminder',text:'Patrol assigned at Accra House',severity:'Info',read:false}],offline:0,sos:false};
const $=id=>document.getElementById(id),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const c=(body,cl='')=>`<div class="card ${cl}">${body}</div>`;const btn=(label,fn,cl='')=>`<button class="btn ${cl}" onclick="${fn}">${label}</button>`;const head=(title,desc)=>`<h1>${title}</h1><p class="small">${desc}</p>`;const line=(icon,title,desc,fn)=>`<div class="item" onclick="${fn}"><span class="symbol">${icon}</span><div class="grow"><strong>${title}</strong><p>${desc}</p></div><span class="muted">›</span></div>`;
function nav(){let items=[['home','⌂','Home'],['dispatch','♧','Dispatch'],['patrol','◇','Patrol'],['scan','▦','Scan'],['more','☷','More']];$('bottom').innerHTML=items.map(([id,icon,name])=>`<button class="nav ${S.page===id?'active':''}" onclick="openPage('${id}')"><span class="glyph">${icon}</span>${name}</button>`).join('')};
function render(){nav();$('dutyLabel').textContent=S.duty?'● On duty':'○ Off duty';$('nbadge').textContent=S.alerts.filter(x=>!x.read).length;let page={home,dispatch,patrol,scan,more,notifications,shift,openshifts,swap,passdown,report,messages,settings,profile,history,help}[S.page]||home;$('main').innerHTML=page()};function openPage(p){S.page=p;S.sub='';render();window.scrollTo(0,0)}function toast(msg){$('snack').innerHTML=`<div class="snack">${esc(msg)}</div>`;setTimeout(()=>$('snack').innerHTML='',2800)}
function home(){return `${head('Good afternoon, George','Your operational overview for today.')}${c(`<div class="row between"><div><div class="eyebrow">Current assignment</div><div class="big">Accra House</div><p>⌖ Labone, Accra</p></div><span class="chip green">✓ Protected</span></div><div class="sep"></div><div class="row between small"><span>06:00 – 18:00</span><span class="green">1 of 1 guard on duty</span></div><div class="btnrow">${btn('View my shift',"openPage('shift')")}</div>`,'ok')}${S.dispatch!=='Completed'?c(`<div class="row between"><strong>◉ PAT-2018 · Alarm response</strong><span class="chip red">${S.dispatch}</span></div><p class="small" style="margin:9px 0">Accra House · Patriot escalation · Action required</p>${btn('Open dispatch →',"openPage('dispatch')",'primary block')}`,'urgent'):c(`<strong>✓ Dispatch response submitted</strong><p class="small">PAT-2018 · ${esc(S.outcome||'Completed')}</p>`,'ok')}${c(`<div class="row between"><div><div class="eyebrow">Assigned patrol</div><strong>Night Round</strong><p class="small">8 checkpoints · 40 min</p></div><span class="chip">${S.patrol}</span></div><div class="bar"><div class="fill" style="width:${S.scans/8*100}%"></div></div><div class="btnrow">${btn('View patrol',"openPage('patrol')")}${btn(S.patrol==='Not started'?'Start patrol':'Scan checkpoint',S.patrol==='Not started'?"startPatrol()":"openPage('scan')",'primary')}</div>`)}<div class="section"><h2>Quick actions</h2><div class="tiles">${[['⌖','Update location','Send latest available location',"toast('Demo: GPS update requested')"],['≡','Passdown notes','Complete your handover',"openPage('passdown')"],['⚠','Report incident','Document an event',"openPage('report')"],['☎','Contact control','Open communication details',"openPage('messages')"]].map(([i,t,d,f])=>`<button class="tile" onclick="${f}"><span class="sym">${i}</span><strong>${t}</strong><p>${d}</p></button>`).join('')}</div></div>`}
function dispatch(){if(['detail','complete'].includes(S.sub))return dispatchDetail();return `${head('Dispatch','Assigned alarms and field responses')}
<div class="tabrow">${['Assigned','Active','Completed'].map(t=>`<button class="${S.sub===t?'selected':''}" onclick="S.sub='${t}';render()">${t}</button>`).join('')}</div>${(S.sub==='Completed'&&S.dispatch!=='Completed')||(S.sub==='Active'&&S.dispatch==='Assigned')||(S.sub==='Assigned'&&S.dispatch!=='Assigned')?`<div class="empty">No dispatches in this category.</div>`:c(`<div class="row between"><div class="big">PAT-2018</div><span class="chip ${S.dispatch==='Completed'?'green':'red'}">${S.dispatch}</span></div><p style="margin-top:5px">Panic alarm · Critical priority</p><div class="sep"></div><p>⌖ Accra House, Labone</p><p>Customer: Mr. Mark Daniel</p><p>Reference: GCS-000245</p><div class="btnrow">${btn('View response →',"S.sub='detail';render()",'primary block')}</div>`,S.dispatch==='Completed'?'ok':'urgent')}`}
function dispatchDetail(){let states=['Assigned','Accepted','En route','On site','Completed'];let ix=states.indexOf(S.dispatch);let next=states[Math.min(ix+1,4)];return `<button class="btn" onclick="S.sub='';render()">← Back to dispatches</button><div class="section">${head('PAT-2018','Panic alarm · Accra House')}</div>${c(`<div class="row between"><span class="chip red">Critical</span><span class="chip ${ix===4?'green':'amber'}">${S.dispatch}</span></div><div class="steps">${states.map((s,i)=>`<div class="step ${i<ix?'done':i===ix?'current':''}">${s}</div>`).join('')}</div><div class="eyebrow">Dispatch instructions</div><p>Proceed to the site, contact Control if unsafe, report arrival and record findings. Do not enter hazardous premises.</p>`,'urgent')}${c(`<div class="row between"><div><strong>Accra House</strong><p>Labone, Accra, Ghana</p><p class="small">Patriot source · PAT-2018</p></div><span class="chip">Site</span></div><div class="map"><span class="corner">Map preview · illustrative</span></div><div class="btnrow">${btn('Map / directions',"toast('Demo: navigation would launch verified site coordinates')")}${btn('Call Control',"toast('Demo: call Control using configured contact')")}</div>`)}${ix<4?c(`<div class="eyebrow">Next action</div>${ix===0?btn('✓ Accept dispatch',"advanceDispatch()",'primary block'):ix===1?btn('↗ Mark en route',"advanceDispatch()",'primary block'):ix===2?btn('⌖ Confirm arrival on site',"advanceDispatch()",'primary block'):btn('Prepare completion report',"S.sub='complete';render()",'primary block')}${ix===0?`<div class="btnrow">${btn('Decline with reason',"declinePrompt()")}</div>`:''}`):''}${S.sub==='complete'?completion():''}${ix===4?c(`<strong>✓ Response completed</strong><p>${esc(S.outcome||'Completed')}</p><p class="small">Submitted to GCS; Patriot update is handled by Control.</p>`,'ok'):''}<div class="footerhint">Demo transitions only. Live dispatch requires authenticated server validation.</div>`}
function advanceDispatch(){let states=['Assigned','Accepted','En route','On site','Completed'];let i=states.indexOf(S.dispatch);if(i<3){S.dispatch=states[i+1];render();toast('Dispatch status updated in prototype')}else{S.sub='complete';render()}}
function declinePrompt(){modal('Decline dispatch',`<p class="small">A valid reason is required. Control must be notified.</p><label class="label">Reason</label><textarea class="field" rows="3" id="declineReason" placeholder="Explain why you cannot respond"></textarea><div class="btnrow">${btn('Cancel','closeModal()')}${btn('Submit decline',"if($('declineReason').value.trim()){closeModal();toast('Demo: decline sent to Control for reassignment')}else toast('Reason required')",'primary')}</div>`)}
function completion(){return c(`<h2>Response completion</h2><label class="label">Outcome *</label><select class="field" id="outcome"><option value="">Choose an outcome</option><option>False alarm</option><option>Site secure</option><option>Suspicious activity</option><option>Assistance requested</option><option>Other</option></select><label class="label">Field findings *</label><textarea class="field" id="findings" rows="4" placeholder="Describe findings, safety concerns and action taken"></textarea><div class="switch"><span>Evidence attached (demo)</span><input type="checkbox" id="evidence"></div>${btn('Submit completion report','submitCompletion()','success block')}`)}
function submitCompletion(){let o=$('outcome')?.value,n=$('findings')?.value.trim();if(!o||!n){toast('Outcome and findings are required');return}S.dispatch='Completed';S.outcome=o;S.notes=n;S.evidence=$('evidence').checked;S.sub='detail';render();toast('Demo: completion recorded; supervisor review pending')}
function patrol(){return `${head('Patrol','Follow your route and verify checkpoints')}${c(`<div class="row between"><div><div class="eyebrow">Current route</div><div class="big">Night Round</div><p>Accra House · Labone</p></div><span class="chip ${S.patrol==='Completed'?'green':'amber'}">${S.patrol}</span></div><div class="sep"></div><div class="row between small"><span>8 checkpoints</span><span>${S.scans}/8 complete</span></div><div class="bar"><div class="fill" style="width:${S.scans/8*100}%"></div></div><div class="btnrow">${S.patrol==='Not started'?btn('▶ Start patrol','startPatrol()','primary block'):S.patrol==='Completed'?btn('View history',"openPage('history')",'block'):btn('Scan next checkpoint',"openPage('scan')",'primary block')}</div>`)}<div class="section"><h2>Route and checkpoints</h2><div class="map"><span class="corner">Illustrative route preview</span></div>${['Main Gate','Reception','Administration Block','Generator Area','Parking Area','Store Room','Rear Perimeter','Exit Gate'].map((n,i)=>line(i<S.scans?'✓':i===S.scans?'◉':'○',`CP-${String(i+1).padStart(2,'0')} · ${n}`,i<S.scans?'Verified':i===S.scans?'Next checkpoint':'Pending',`openPage('scan')`)).join('')}</div>${S.scans===8&&S.patrol!=='Completed'?btn('Finish patrol and submit',"finishPatrol()",'success block'):''}`}
function startPatrol(){S.patrol='In progress';openPage('patrol');toast('Patrol started')};function finishPatrol(){S.patrol='Completed';openPage('patrol');toast('Patrol completion recorded in demo')}
function scan(){return `${head('Checkpoint scan','QR, NFC or manual checkpoint entry')}${c(`<div class="row between"><div><div class="eyebrow">Active patrol</div><strong>Night Round</strong><p>Accra House · ${S.scans}/8 checkpoints</p></div><span class="chip ${S.patrol==='In progress'?'green':'amber'}">${S.patrol}</span></div><div class="bar"><div class="fill" style="width:${S.scans/8*100}%"></div></div>`)}${S.patrol==='In progress'?`${c(`<div class="center"><div class="eyebrow">Next checkpoint</div><div class="big">CP-${String(Math.min(S.scans+1,8)).padStart(2,'0')}</div><p>${['Main Gate','Reception','Administration Block','Generator Area','Parking Area','Store Room','Rear Perimeter','Exit Gate'][Math.min(S.scans,7)]}</p></div><div class="scanbox"><span>▦</span></div><div class="toolbar">${btn('Scan QR','simulateScan()','primary')}${btn('Read NFC','simulateScan()')}</div><div class="label">Manual code (fallback)</div><input class="field" id="scanCode" placeholder="Enter checkpoint code">${btn('Validate code',"if($('scanCode').value.trim())simulateScan();else toast('Enter a checkpoint code')",'block')}`)}<div class="footerhint">The prototype simulates scans. Production must validate QR/NFC tokens, route, timestamp, permissions and GPS accuracy.</div>`:`<div class="empty">Start an assigned patrol to scan checkpoints.<div class="section">${btn('Open patrol',"openPage('patrol')",'primary')}</div></div>`}`}
function simulateScan(){if(S.scans<8){S.scans++;if(S.scans===8)toast('All 8 checkpoints verified. Finish your patrol.');else toast(`Checkpoint ${S.scans} verified (demo)`);render()}else toast('All checkpoints already recorded')}
function more(){return `${head('Operations Hub','Shift tools, reports and app settings')}${c(`<div class="row between"><div><strong>George Adjei</strong><p>Guard ID GC-0145 · Accra House</p></div><span class="chip ${S.duty?'green':'amber'}">${S.duty?'On duty':'Off duty'}</span></div>`)}<div class="section"><h2>Shift and attendance</h2>${line('▣','My shift','Attendance, handover and clock out',"openPage('shift')")}${line('▤','Open shifts','Review available assignments',"openPage('openshifts')")}${line('⇄','Shift swap','Request a shift exchange',"openPage('swap')")}${line('≡','Passdown notes','Submit site handover information',"openPage('passdown')")}</div><div class="section"><h2>Field operations</h2>${line('⚠','Report incident','Submit safety observations and reports',"openPage('report')")}${line('◷','Patrol history','Review completed checkpoint activity',"openPage('history')")}</div><div class="section"><h2>Communication</h2>${line('♧','Notifications','Operational alerts and assignments',"openPage('notifications')")}${line('▤','Messages / Control','Contact operations and view messages',"openPage('messages')")}</div><div class="section"><h2>Device and account</h2>${line('⚙','Settings','GPS, notifications and permissions',"openPage('settings')")}${line('◉','My profile','Personal and employment information',"openPage('profile')")}${line('?','Help and support','Emergency procedures and assistance',"openPage('help')")}</div>`}
function notifications(){return `${head('Notifications','New assignments and operational alerts')}<div class="btnrow">${btn('Mark all read',"S.alerts.forEach(a=>a.read=true);render();toast('Notifications marked read')")}</div>${S.alerts.map(a=>c(`<div class="row between"><strong>${a.title}</strong><span class="chip ${a.severity==='Critical'?'red':''}">${a.severity}</span></div><p class="small" style="margin:9px 0">${a.text}</p><div class="btnrow">${btn('Open related record',a.id===1?"S.alerts[0].read=true;openPage('dispatch')":"openPage('patrol')")}${!a.read?btn('Mark read',`S.alerts.find(x=>x.id===${a.id}).read=true;render()`):''}</div>`,a.severity==='Critical'?'urgent':'')).join('')}`}
function shift(){return `${head('My shift','Attendance and site protection status')}${c(`<div class="row between"><div><strong>Accra House</strong><p>06:00 – 18:00</p></div><span class="chip ${S.duty?'green':'amber'}">${S.duty?'On duty':'Off duty'}</span></div><div class="sep"></div><p>Site coverage and deployment are verified independently by the backend.</p><div class="btnrow">${btn(S.duty?'Request check-out':'Request clock-in',"modal('Attendance confirmation','<p>In production, this action requires backend authorization, location/shift validation and an audit log.</p><div class=btnrow><button class=\"btn\" onclick=\"closeModal()\">Cancel</button><button class=\"btn primary\" onclick=\"S.duty=!S.duty;closeModal();render();toast(\'Demo duty status changed\')\">Confirm demo</button></div>')",'primary')}</div>`)}${line('≡','Submit passdown notes','Handover to the next guard',"openPage('passdown')")}`}
function openshifts(){return `${head('Open shifts','Assignments that may be available')}${c(`<strong>No confirmed open shifts in this demo</strong><p class="small">The production list must come from the scheduling API and respect branch and qualification rules.</p>`)}${btn('Back to tools',"openPage('more')")}`}
function swap(){return `${head('Shift swap','Request an authorized shift exchange')}${c(`<label class="label">Reason for swap</label><textarea class="field" rows="4" id="swapReason" placeholder="Provide your reason"></textarea><p class="small" style="margin:12px 0">The supervisor must approve changes before schedules are updated.</p>${btn('Submit request',"if($('swapReason').value.trim())toast('Demo: shift-swap request captured');else toast('Enter a reason')",'primary block')}`)}`}
function passdown(){return `${head('Passdown notes','Leave useful information for the incoming guard')}${c(`<p class="small">Site: Accra House · Current shift</p><label class="label">Site condition and pending issues</label><textarea class="field" rows="5" id="passdownText" placeholder="Describe patrol findings, incidents, keys and instructions"></textarea>${btn('Submit passdown',"if($('passdownText').value.trim())toast('Demo: passdown submitted for handover');else toast('Add passdown details')",'primary block')}`)}`}
function report(){return `${head('Incident report','Record an operational or safety observation')}${c(`<label class="label">Category</label><select class="field" id="incidentCategory"><option>Security observation</option><option>Safety concern</option><option>Maintenance issue</option><option>Other</option></select><label class="label">Description *</label><textarea class="field" rows="5" id="incidentText" placeholder="What happened, where, and what actions were taken?"></textarea>${btn('Submit incident report',"if($('incidentText').value.trim())toast('Demo: incident report captured');else toast('Describe the incident')",'primary block')}`)}`}
function messages(){return `${head('Communication','Reach the control room and operations')} ${c(`<strong>Control room</strong><p class="small">Use the approved emergency escalation channel for urgent assistance.</p><div class="btnrow">${btn('Call Control',"toast('Demo: configured control-room phone required')")}${btn('Request support',"toast('Demo: support request captured')")}</div>`)}${c(`<strong>Messages</strong><p class="small">No messages in this demo account.</p>`)}`}
function settings(){return `${head('Settings','Permissions, connectivity and preferences')}${c(`<h2>Device status</h2><div class="switch"><span>GPS tracking</span><span class="chip green">Ready · demo</span></div><div class="switch"><span>Offline sync</span><span class="chip green">${S.offline} queued</span></div><div class="switch"><span>Emergency notifications</span><span class="chip green">Required</span></div><div class="switch"><span>Routine notification sound</span><input type="checkbox" checked></div><div class="switch"><span>Reduced motion</span><input type="checkbox"></div><p class="small" style="margin-top:14px">Real permissions and background location support must be checked on the deployed device.</p>`)}${btn('Test notification (demo)',"S.alerts.push({id:Date.now(),title:'Test notification',text:'Local design preview only',severity:'Info',read:false});render();toast('Test notification added')",'block')}`}
function profile(){return `${head('My profile','Guard identity and employment details')}${c(`<strong>George Adjei</strong><p>Guard ID: GC-0145</p><p>Role: Security Guard</p><p>Current assignment: Accra House</p><p>Account: Demo Security Company</p>`)}<p class="footerhint">Illustrative profile; user and site records come from GCS when connected.</p>`}
function history(){return `${head('Patrol history','Previous patrols and checkpoint scans')}${c(`<strong>Night Round</strong><p class="small">${S.scans}/8 checkpoints in current demo session</p><p class="small">Status: ${S.patrol}</p>`)}`};function help(){return `${head('Help and support','Operational assistance and emergency guidance')}${c(`<strong>Emergency assistance</strong><p>Use SOS only for a genuine emergency. Contact Control using your approved emergency channel if the app cannot establish a connection.</p><div class="btnrow">${btn('Contact Control',"openPage('messages')")}</div>`)}${c(`<strong>App support</strong><p class="small">Report device, camera, NFC, GPS or sync issues to your supervisor.</p>`)}`}
function modal(title,body){$('modals').innerHTML=`<div class="overlay"><div class="modal"><h2>${title}</h2>${body}</div></div>`}function closeModal(){$('modals').innerHTML=''}
function openSOS(){modal('Emergency SOS',`<div class="soshero">◉</div><div class="callout">This action is for immediate personal danger or emergencies. Control should receive your current location and an urgent alert.</div><div class="section"><p class="small">In the live application: confirmed delivery, acknowledgment and fallback communication must be implemented. This prototype does not send any real alert.</p></div><div class="btnrow">${btn('Cancel','closeModal()')}${btn('Activate demo SOS','activateSOS()','primary')}</div>`)}function activateSOS(){closeModal();S.sos=true;modal('SOS activated · demo',`<div class="soshero">⚠</div><p class="center">Emergency alert recorded locally for demonstration.</p><div class="callout" style="margin:16px 0">Production state: Awaiting control room acknowledgment, with a visible timer and fallback instructions.</div>${btn('Close demo',"closeModal()",'block')}`)}
render();</script></body></html>
